name: restore-lockfile
on:
  push:
    paths:
      - '.ci-restore/**'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-overview-scroll-stamp
      - name: Decode and commit package-lock.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, base64, pathlib
          parts = sorted(pathlib.Path('.ci-restore').glob('lock.part*'), key=lambda p: int(p.name.replace('lock.part','')))
          b = ''.join(p.read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(b))
          pathlib.Path('package-lock.json').write_bytes(data)
          print('wrote', len(data), 'from', len(parts), 'parts')
          PY
          rm -rf .ci-restore
          rm -f .github/workflows/restore-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync package-lock (pager-view 8.0.2, gesture-handler ~2.32.0)" || exit 0
          git push
